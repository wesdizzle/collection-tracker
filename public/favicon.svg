<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Cartridge Outer Shell with Bottom Connector Well (4:3 ratio) -->
  <path d="M 8.5 8 L 39.5 8 A 4.5 4.5 0 0 1 44 12.5 L 44 35 A 4 4 0 0 1 40 39 L 35 39 L 35 32.5 L 13 32.5 L 13 39 L 8 39 A 4 4 0 0 1 4 35 L 4 12.5 A 4.5 4.5 0 0 1 8.5 8 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Front Label Inset Frame -->
  <rect x="10.5" y="10.5" width="27" height="20" rx="3.5" fill="none" stroke="url(#primaryGrad)" stroke-width="1.6"/>
  <!-- Optical Disc Arc (Golden Amber to Crimson Rose Gradient) -->
  <circle cx="24" cy="20.5" r="6.8" fill="none" stroke="url(#discGrad)" stroke-width="2.2" stroke-dasharray="28 8"/>
  <!-- Spindle Hub & Center Hole -->
  <circle cx="24" cy="20.5" r="2.6" fill="none" stroke="url(#primaryGrad)" stroke-width="1.8"/>
  <circle cx="24" cy="20.5" r="0.9" fill="url(#primaryGrad)"/>
  <!-- 4 Wide Gold PCB Edge Connector Pads (Enclosed within bottom well) -->
  <rect x="14.2" y="33.5" width="3.8" height="4.8" rx="0.6" fill="url(#goldGrad)"/>
  <rect x="19.5" y="33.5" width="3.8" height="4.8" rx="0.6" fill="url(#goldGrad)"/>
  <rect x="24.7" y="33.5" width="3.8" height="4.8" rx="0.6" fill="url(#goldGrad)"/>
  <rect x="30.0" y="33.5" width="3.8" height="4.8" rx="0.6" fill="url(#goldGrad)"/>
</svg>