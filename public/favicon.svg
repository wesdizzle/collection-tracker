<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- Cartridge Body -->
  <rect x="6" y="7" width="36" height="35" rx="6" fill="#1e1e24" stroke="url(#primaryGrad)" stroke-width="2.5"/>
  <!-- Cartridge Notch -->
  <path d="M14 7 L14 12 L34 12 L34 7" fill="none" stroke="url(#primaryGrad)" stroke-width="2"/>
  <!-- Optical Disc Outer Arc -->
  <circle cx="24" cy="25" r="9.5" fill="none" stroke="url(#discGrad)" stroke-width="2.2" stroke-dasharray="34 12"/>
  <!-- Optical Disc Inner Ring / Spindle Hub -->
  <circle cx="24" cy="25" r="3.5" fill="#121214" stroke="url(#primaryGrad)" stroke-width="2"/>
  <circle cx="24" cy="25" r="1.5" fill="url(#primaryGrad)"/>
  <!-- Bottom Connector Pins -->
  <line x1="12" y1="37" x2="12" y2="42" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="37" x2="20" y2="42" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="37" x2="28" y2="42" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="37" x2="36" y2="42" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>