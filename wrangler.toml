name = "collection-tracker"
compatibility_date = "2024-04-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
main = "worker/worker.ts"

[assets]
directory = "dist/tracker/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin/*", "/manifest.webmanifest", "/favicon.svg"]

[[d1_databases]]
binding = "DB"
database_name = "collection-db"
database_id = "local-dev-db"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "collection-backups"

[triggers]
crons = ["*/30 * * * *"]

[build]
command = "npm run build"
