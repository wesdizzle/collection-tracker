<div class="admin-container">
  <div class="admin-header-panel mb-lg">
    <div class="flex items-center justify-between gap-md flex-wrap">
      <div>
        <h1 class="text-gradient m-0">Admin Center</h1>
        <p class="subtitle m-0 mt-2xs">
          Autonomous catalog pipeline telemetry, write budget guardrails, and
          self-healing controls.
        </p>
      </div>
      <a
        routerLink="/admin/verify-ownership"
        class="admin-action-link"
        data-testid="admin-verify-ownership-link"
      >
        <app-icon name="disc" [size]="16" />
        <span>Verify Owned Media</span>
      </a>
    </div>
  </div>

  @if (toastMessage()) {
    <div class="admin-toast" role="status" aria-live="polite">
      <app-icon name="check" [size]="16" />
      <span>{{ toastMessage() }}</span>
    </div>
  }

  <app-pipeline-health
    [status]="pipelineStatus()"
    [loading]="pipelineLoading()"
    [actionBusy]="pipelineActionBusy()"
    [error]="pipelineError()"
    [dailyBudgetPct]="dailyBudgetPct()"
    [rollingProgressPct]="rollingProgressPct()"
    [marketPricingStatus]="marketPricingStatus()"
    [marketCachePurging]="marketCachePurging()"
    (refresh)="loadPipelineDiagnostics()"
    (runSeedBatch)="triggerSeedBatchNow()"
    (runRollingRefresh)="triggerRollingRefreshNow()"
    (runSeriesDiscovery)="triggerSeriesDiscoveryNow()"
    (runNsCollectors)="triggerNsCollectorsNow()"
    (runRetailPreOrders)="triggerRetailPreOrdersNow()"
    (runWorkerDats)="triggerWorkerDatsNow()"
    (recomputeCoverage)="triggerRecomputeCoverageNow()"
    (togglePlanTier)="toggleWorkerPlanTier($event)"
    (purgeMarketCache)="purgeMarketPriceCache()"
  />
</div>
