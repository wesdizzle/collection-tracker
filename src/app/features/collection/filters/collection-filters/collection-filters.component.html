<kit-filter-bar
  [search]="filters().name || filters().seriesOrName || ''"
  searchPlaceholder="Search by title or series..."
  searchInputId="filter-name"
  [searchDebounceMs]="150"
  [quickPills]="quickPills()"
  quickPillsAriaLabel="Quick ownership filter"
  [activeFilterCount]="activeFilterCount()"
  [resultCount]="resultCount()"
  resultCountNoun="items"
  [lastUpdated]="lastUpdated()"
  [viewMode]="viewMode()"
  [(showDrawer)]="showDrawer"
  (searchChange)="onQuickSearchChange($event)"
  (searchCleared)="clearQuickSearch()"
  (quickPillClick)="onQuickPillClick($event)"
  (viewModeChange)="onViewModeSelect($event)"
  (resetFilters)="resetFilters()"
>
  <kit-select
    kitFilterQuickSort
    variant="compact-sort"
    dropdownName="sortBy"
    triggerId="filter-sort-by"
    [value]="filters().sortBy || 'default'"
    [options]="sortByOptions"
    placeholder="Default"
    (valueChange)="selectOption('sortBy', $event)"
  />

  <!-- Ownership Status -->
  <kit-select
    label="Ownership Status"
    dropdownName="ownership"
    triggerId="filter-ownership"
    [value]="filters().ownership"
    [options]="ownershipOptions"
    (valueChange)="selectOption('ownership', $event)"
  />

  @if (currentTab() === 'games') {
    <!-- Play Status -->
    <kit-select
      label="Play Status"
      dropdownName="play_status"
      triggerId="filter-play-status"
      [value]="filters().play_status || 'all'"
      [options]="playStatusOptions"
      (valueChange)="selectOption('play_status', $event)"
    />

    <!-- Backup -->
    @if (showBackupDetails()) {
      <kit-select
        label="Backup"
        dropdownName="backup_status"
        triggerId="filter-backup-status"
        [value]="filters().backup_status ?? 'all'"
        [options]="backupOptions"
        (valueChange)="selectOption('backup_status', $event)"
      />
    }

    <!-- Verified Source Match -->
    <kit-select
      label="Verified Source Match"
      dropdownName="physical_verified"
      triggerId="filter-physical-verified"
      [value]="filters().physical_verified ?? 'all'"
      [options]="physicalVerifiedOptions"
      (valueChange)="selectOption('physical_verified', $event)"
    />

    <!-- Budget Label Status -->
    <kit-select
      label="Budget Label Status"
      dropdownName="budget_label"
      triggerId="filter-budget-label"
      [value]="filters().budget_label ?? 'all'"
      [options]="budgetLabelOptions"
      (valueChange)="selectOption('budget_label', $event)"
    />

    <!-- Platform -->
    <kit-select
      label="Platform"
      dropdownName="platform"
      triggerId="filter-platform"
      [value]="filters().platform_id"
      [allOption]="platformAllOption"
      [groups]="platformSelectGroups()"
      placeholder="All Platforms"
      (valueChange)="selectPlatform($event)"
    />
  }

  @if (currentTab() === 'toys') {
    <!-- Line -->
    <kit-select
      label="Line"
      dropdownName="line"
      triggerId="filter-line"
      [value]="filters().line || ''"
      [allOption]="lineAllOption"
      [options]="lineSelectOptions()"
      placeholder="All Lines"
      (valueChange)="selectOption('line', $event)"
    />

    <!-- Type -->
    <kit-select
      label="Type"
      labelTitle="Form factor (e.g. Figure, Card, Yarn)"
      dropdownName="type"
      triggerId="filter-type"
      [value]="filters().type || ''"
      [allOption]="typeAllOption"
      [options]="typeSelectOptions()"
      placeholder="All Types"
      (valueChange)="selectOption('type', $event)"
    />
  }

  <!-- Series Combobox Text Input Dropdown -->
  <kit-combobox
    label="Series"
    inputId="filter-series"
    dropdownName="series"
    [value]="filters().series || ''"
    [suggestions]="uniqueSeries()"
    placeholder="All"
    allOptionLabel="All Series"
    emptyMessagePrefix="No series matching"
    toggleAriaLabel="Toggle series suggestions"
    [showExactToggle]="true"
    [exact]="!!filters().seriesExact"
    (valueChange)="onPartialChange('series', $event)"
    (exactChange)="onPartialChange('seriesExact', $event)"
  />

  <!-- Tag Combobox Text Input Dropdown (Games Tab) -->
  @if (currentTab() === 'games') {
    <kit-combobox
      label="Tag"
      inputId="filter-tag"
      dropdownName="tag"
      [value]="filters().tag || ''"
      [suggestions]="uniqueTags()"
      placeholder="All"
      allOptionLabel="All Tags"
      emptyMessagePrefix="No tags matching"
      toggleAriaLabel="Toggle tag suggestions"
      [showExactToggle]="true"
      [exact]="!!filters().tagExact"
      (valueChange)="onPartialChange('tag', $event)"
      (exactChange)="onPartialChange('tagExact', $event)"
    />
  }

  <!-- Region Multi-Select Dropdown -->
  <kit-multiselect
    label="Region"
    triggerId="filter-region"
    dropdownName="region"
    containerClass="region-dropdown-container"
    [selected]="filters().regions || []"
    [options]="uniqueRegions()"
    allLabel="All Regions"
    clearLabel="Clear Selection"
    emptyLabel="No regions found"
    (selectedChange)="onPartialChange('regions', $event)"
  />

  <!-- Secondary Action Buttons -->
  <div class="secondary-actions-group">
    <button
      type="button"
      class="m3-input deals-toggle-btn state-layer"
      [class.active]="filters().retail_available"
      (click)="toggleRetailAvailable()"
      id="filter-retail-available"
      title="Show only items currently available at retail"
    >
      <span class="deals-icon"><app-icon name="storefront" [size]="16" /></span>
      <span>Available at Retail</span>
    </button>
    <button
      type="button"
      class="m3-input deals-toggle-btn state-layer"
      [class.active]="filters().deals_only"
      (click)="toggleDealsOnly()"
      id="filter-deals-only"
      title="Show only items currently on sale or clearance"
    >
      <span class="deals-icon"><app-icon name="flame" [size]="16" /></span>
      <span>Deals Only</span>
    </button>
  </div>
</kit-filter-bar>
